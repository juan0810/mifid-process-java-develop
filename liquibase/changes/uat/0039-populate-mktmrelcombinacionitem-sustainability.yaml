databaseChangeLog:
  - changeSet:
      id: 0039-populate-mktmrelcombinacionitem-sustainability
      author: System Admin <admin@singularbank.com>
      context: dev
      comment: "Poblar reglas de sostenibilidad (MKTMCOMBINACIONESRESPUESTAS y MKTMRELCOMBINACIONITEM) basadas en matriz de decisión. Total: 135 combinaciones válidas."
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: "SELECT COUNT(*) FROM mktmcombinacionesrespuestas WHERE crid BETWEEN 1000 AND 1200"
      changes:
        # =====================================================
        # ACTUALIZAR COMENTARIO DE COLUMNA CRDESCRIPCION
        # Para evitar confusión con el PDF, aclarar que este campo
        # es solo para identificación interna, NO para mostrar al cliente
        # =====================================================
        - sql:
            sql: |
              COMMENT ON COLUMN mktmcombinacionesrespuestas.crdescripcion IS 
              'Descripción interna de la combinación (NO usar para PDF). Para texto cliente usar CRJUSTIFICACION o CRMENSAJE';
            rollback:
              sql: COMMENT ON COLUMN mktmcombinacionesrespuestas.crdescripcion IS NULL;

        # =====================================================
        # REGLAS DE SOSTENIBILIDAD
        # P1: Pregunta 1 (ITORDEN=1) - Valores: B
        # P2: Pregunta 2 (ITORDEN=2) - Valores: A, B, C
        # P3: Pregunta 3 (ITORDEN=3) - Valores: A, B, C
        # P4: Pregunta 4 (ITORDEN=4) - Valores: A, B, C, D, E
        # P5: Pregunta 5 (ITORDEN=5) - Valores: A, B, C
        # 
        # Resultados almacenados en CRJUSTIFICACION (JSON):
        # - pct_cartera: % en cartera (decimal)
        # - pct_inv_sost: % sustainable investment (decimal o ">X")
        # - tax_aligned: Tax aligned (">2", ">5", ">20", etc.)
        # - pai_env: Environmental PAI (true cuando 100)
        # - pai_social: Social PAI (true cuando 100)
        # - pai_cons: PAI consideration (true cuando 100)
        #
        # Solo se insertan combinaciones con al menos UN valor significativo.
        # Combinaciones con todos los campos en null (P5=D) NO se insertan.
        # =====================================================

        # CRID 1000: B-A-A-A-A
        - insert:
            tableName: mktmcombinacionesrespuestas
            columns:
              - column: { name: crid, valueNumeric: 1000 }
              - column: { name: crresultado, value: 'SO' }
              - column: { name: crdescripcion, value: 'Sostenibilidad B-A-A-A-A' }
              - column: { name: crjustificacion, value: '{"pct_cartera":0.05,"pct_inv_sost":null,"tax_aligned":null,"pai_env":null,"pai_social":null,"pai_cons":null}' }
              - column: { name: crmensaje, value: 'Preferencias de Sostenibilidad registradas' }
              - column: { name: crusualta, value: 'SYSTEM' }
        - insert:
            tableName: mktmrelcombinacionitem
            columns:
              - column: { name: ciidcombinacion, valueNumeric: 1000 }
              - column: { name: ciiditem, valueComputed: "(SELECT itid FROM mktmitems WHERE ittipoitem='RE' AND itdependede=(SELECT itid FROM mktmitems WHERE ittipoitem='PR' AND itorden=2 AND ittipotest='SO' LIMIT 1) AND itvalor='B' LIMIT 1)" }
              - column: { name: ciusualta, value: 'SYSTEM' }

        - insert:
            tableName: mktmrelcombinacionitem
            columns:
              - column: { name: ciidcombinacion, valueNumeric: 1000 }
              - column: { name: ciiditem, valueComputed: "(SELECT itid FROM mktmitems WHERE ittipoitem='RE' AND itdependede=(SELECT itid FROM mktmitems WHERE ittipoitem='PR' AND itorden=4 AND ittipotest='SO'LIMIT 1) AND itvalor='A' LIMIT 1)" }
              - column: { name: ciusualta, value: 'SYSTEM' }

