        # FAMILIA A - DEPÓSITOS BANCARIOS (CRID 20)
        # Condiciones: P3=D (correcta) Y P10-A IN (A,B) experiencia
        # =====================================================
        
        # P3 = D (respuesta correcta conocimiento general)
        - insert:
            tableName: mktmrelcombinacionitem
            columns:
              - column: { name: ciidcombinacion, valueNumeric: 20 }
              - column: { name: ciiditem, valueComputed: "(SELECT itid FROM mktmitems WHERE ittipoitem='RE' AND itdependede=(SELECT itid FROM mktmitems WHERE ittipoitem='PR' AND itorden=3 AND ittipotest='CO' LIMIT 1) AND itvalor='D' LIMIT 1)" }
              - column: { name: ciusualta, value: 'SYSTEM' }
        
        # P10-A = A (experiencia alta)
        - insert:
            tableName: mktmrelcombinacionitem
