databaseChangeLog:
  - changeSet:
      id: 0038-populate-mktmrelcombinacionitem-convenience
      author: System Admin <admin@singularbank.com>
      context: dev
      comment: "Poblar MKTMRELCOMBINACIONITEM con las condiciones mínimas para familias de conveniencia (A-K)"
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: "SELECT COUNT(*) FROM mktmrelcombinacionitem WHERE ciidcombinacion BETWEEN 20 AND 30"
