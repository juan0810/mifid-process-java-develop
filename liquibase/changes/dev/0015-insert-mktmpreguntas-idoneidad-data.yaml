databaseChangeLog:
  - changeSet:
      id: 0015-preguntas-idoneidad
      author: System Admin <admin@singularbank.com>
      context: dev
      changes:
        # Pregunta 1 - Rentas de inversiones para gastos corrientes
        - insert:
            tableName: MKTMPREGUNTAS
            columns:
              - column:
                  name: PRID
                  value: 11
              - column:
                  name: PRTIPOID
                  value: 2  # RESPUESTA_UNICA
              - column:
                  name: PRTEXTO
                  value: "¿Qué parte de las rentas de sus inversiones podría necesitar para cubrir sus gastos corrientes?"
              - column:
                  name: PRORDEN
                  value: 1
              - column:
                  name: PRTIPOTEST
                  value: "I"
              - column:
                  name: PRRESPUESTACORRECTA
                  value: false
              - column:
                  name: PRFECINICIO
                  valueDate: "2025-01-01"
              - column:
                  name: PRUSUALTA
                  value: "SISTEMA"

