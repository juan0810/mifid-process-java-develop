  # ==========================================
  - changeSet:
      id: 0027-esg-fila01-00223332W-20250914
      author: System Admin <admin@singularbank.com>
      context: dev
      comment: Sostenibilidad 00223332W - No desea sostenibilidad
      changes:
        - sql:
            endDelimiter: ;
            sql: |
              INSERT INTO mktmrespuestacliente (rcidentity, rcversionid, rcestado, rcfecalta)
              VALUES ('00223332W', 1, 1, '2025-09-14');
              
              INSERT INTO mktmrespuestaclientedetalle (rdrespuestaclienteid, rdrespuestaid) 
              SELECT currval('mktmrespuestacliente_rcid_seq'), reid 
              FROM mktmrespuestas 
              WHERE repreguntaid = 17 AND revalor = 'A';
      rollback:
        - sql:
            sql: |
              DELETE FROM mktmrespuestaclientedetalle 
              WHERE rdrespuestaclienteid = (SELECT MAX(rcid) FROM mktmrespuestacliente WHERE rcidentity = '00223332W' AND rcresconveniencia IS NULL AND rcresidoneidad IS NULL);
              DELETE FROM mktmrespuestacliente 
              WHERE rcid = (SELECT MAX(rcid) FROM mktmrespuestacliente WHERE rcidentity = '00223332W' AND rcresconveniencia IS NULL AND rcresidoneidad IS NULL);

