databaseChangeLog:
  # ==========================================
  # TRUNCATE TABLE
  # ==========================================
  - changeSet:
      id: 0042-truncate-mktmrespuestacliente
      author: System Admin <admin@singularbank.com>
      context: dev
      comment: Truncate mktmrespuestacliente and cascade to detail table
      changes:
        - sql:
            endDelimiter: ;
            sql: |
              TRUNCATE TABLE mktmrespuestacliente CASCADE;

  # ==========================================
  # FILA 1: 00103821E - ESG: C (Banquero decide)
  # ==========================================
  - changeSet:
      id: 0042-esg-fila01-00103821E-20250306
      author: System Admin <admin@singularbank.com>
      context: dev
      comment: Sostenibilidad 00103821E - Delega en banquero
      changes:
        - sql:
            endDelimiter: ;
            sql: |
              INSERT INTO mktmrespuestacliente (rcidentity, rcfecfirma, rcfeccaducidad, rcestado, rcresidoneidad, rcresconveniencia, rcversionid)
              VALUES ('00103821E', '2025-03-06', '2027-03-06', 2, 'Agresivo', 'A,B,C,D,E,F,G,H,I, J, K', 1);
              
              INSERT INTO mktmrespuestaclientedetalle (rdrespuestaclienteid, rdrespuestaid) 
              SELECT currval('mktmrespuestacliente_rcid_seq'), itid 
              FROM mktmitems 
              WHERE itdependede = 17 AND itvalor = 'C';
      rollback:
        - sql:
            sql: |
              DELETE FROM mktmrespuestaclientedetalle 
              WHERE rdrespuestaclienteid = (SELECT MAX(rcid) FROM mktmrespuestacliente WHERE rcidentity = '00103821E' AND rcversionid = 1);
              DELETE FROM mktmrespuestacliente 
              WHERE rcid = (SELECT MAX(rcid) FROM mktmrespuestacliente WHERE rcidentity = '00103821E' AND rcversionid = 1);

