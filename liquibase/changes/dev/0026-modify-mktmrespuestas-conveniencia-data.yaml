databaseChangeLog:
  - changeSet:
      id: 0026-fix-respuestas-conveniencia
      author: System Admin <admin@singularbank.com>
      context: dev
      comment: "Respuestas de conveniencia con valores correctos según MiFID II"
      changes:
        # Borrar respuestas antiguas de preguntas 1-9
        - delete:
            tableName: MKTMRESPUESTAS
            where: REPREGUNTAID IN (1,2,3,4,5,6,7,8,9,101,102,103,104,105,106,107,108,109,110,111)
        # ============================================
        # PREGUNTA 1: Nivel de estudios (4 opciones: A, B, C, D)
        # ============================================
        - insert:
            tableName: MKTMRESPUESTAS
            columns:
              - column: { name: REPREGUNTAID, valueNumeric: 1 }
              - column: { name: RETEXTO, value: "Estudios universitarios (o superiores) con un elevado componente técnico, matemático o relacionados con economía y finanzas" }
              - column: { name: REVALOR, value: "A" }
              - column: { name: RETEXTOLIBRE, valueBoolean: false }
              - column: { name: RECORRECTA, valueBoolean: false }
              - column: { name: REUSUALTA, value: "SISTEMA" }

        - insert:
            tableName: MKTMRESPUESTAS
            columns:
              - column: { name: REPREGUNTAID, valueNumeric: 1 }
              - column: { name: RETEXTO, value: "Estudios universitarios (o superiores) distintos de los anteriores" }
              - column: { name: REVALOR, value: "B" }
              - column: { name: RETEXTOLIBRE, valueBoolean: false }
              - column: { name: RECORRECTA, valueBoolean: false }
              - column: { name: REUSUALTA, value: "SISTEMA" }

        - insert:
            tableName: MKTMRESPUESTAS
            columns:
              - column: { name: REPREGUNTAID, valueNumeric: 1 }
              - column: { name: RETEXTO, value: "Formación profesional y/o bachillerato" }
              - column: { name: REVALOR, value: "C" }
              - column: { name: RETEXTOLIBRE, valueBoolean: false }
              - column: { name: RECORRECTA, valueBoolean: false }
              - column: { name: REUSUALTA, value: "SISTEMA" }

        - insert:
            tableName: MKTMRESPUESTAS
            columns:
              - column: { name: REPREGUNTAID, valueNumeric: 1 }
              - column: { name: RETEXTO, value: "Graduado escolar o sin estudios" }
              - column: { name: REVALOR, value: "D" }
              - column: { name: RETEXTOLIBRE, valueBoolean: false }
              - column: { name: RECORRECTA, valueBoolean: false }
              - column: { name: REUSUALTA, value: "SISTEMA" }

